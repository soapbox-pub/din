[package]
name = "din-compositor"
version = "0.1.0"
edition = "2024"
description = "Din's Wayland compositors: the screen, and the headless one that streams native app windows into Din"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
libc = "0.2.190"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
drm-ffi = "0.9"
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "renderer_gl", "backend_egl", "backend_gbm", "backend_gbm_has_fd_for_plane", "xwayland", "backend_drm", "backend_libinput", "backend_udev", "backend_session_libseat"] }
smithay-drm-extras = { version = "0.1.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.27"
wayland-scanner = "0.31"
# Smithay's own, for the setting that raises how much a client may fall behind.
wayland-server = { version = "0.31", default-features = false, features = ["libwayland_1_23"] }
xcursor = "0.3"

[profile.release]
debug = 1
