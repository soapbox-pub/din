[package]
name = "indd-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

# indd-utils (MIT OR Apache-2.0) reads InDesign documents and converts them
# to IDML. Built to WebAssembly for Layout by scripts/build-indd-wasm.sh.
[lib]
crate-type = ["cdylib"]

[dependencies]
indd = { git = "https://github.com/storytold/indd-utils", rev = "136f973a9d5f1b3ef34e46e27f4a08af196efde7" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
