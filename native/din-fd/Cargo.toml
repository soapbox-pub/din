[package]
name = "din-fd"
version = "0.1.0"
edition = "2024"
description = "Node addon: receive file descriptors (GPU buffers) over a Unix socket"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
