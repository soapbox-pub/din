# What `ngit release publish` publishes for a DinOS release: the NIP-82
# application, release, and asset events (kinds 32267/30063/3063), with the
# image on Blossom. Run by scripts/dinos-release.sh, which builds and stages
# it in .release-artifacts/ first. See https://ngit.dev/releases/manifest.
schema: 1
application: din
# The key DinOS releases are signed with. Publishing fails before anything
# is uploaded under another one.
pubkey: npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj
name: Din
summary: A social computer. Sign in with Nostr, and your identity carries into every app on the desktop.
description: |
  Din is a web-native desktop environment: windows, a dock, apps, and a
  login, where you sign in with your Nostr account and Din bridges that
  identity into every app, keeping their data on Nostr relays and Blossom
  servers.

  DinOS is its operating system, a minimal NixOS that boots straight into
  Din. Write the image to a USB stick to try it, then install it from there.
  Installed systems update themselves, building Din from source.
tags: [nostr, desktop, os, nixos]
license: AGPL-3.0
repository: nostr://npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/git.shakespeare.diy/din
publication:
  blossom_servers:
    - https://blossom.ditto.pub
    - https://blossom.primal.net
    - https://blossom.dreamith.to
  relays:
    - wss://relay.ditto.pub
    - wss://relay.primal.net
    - wss://relay.dreamith.to
assets:
  # The disk image, for new installs: `zstdcat … | dd` to a USB stick.
  - file: .release-artifacts/DinOS-v{version}-x86_64.img.zst
    mime: application/zstd
    variant: image
    platforms: [linux-x86_64]
