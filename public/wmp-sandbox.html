<!DOCTYPE html>
<!--
    The Media Player runs Windows Media Player skins' JScript in here: an
    iframe sandboxed without allow-same-origin, so it has an opaque origin and
    can't touch Din's storage, bridges or files, and a CSP that allows no
    network at all. wmp-sandbox.js waits for Din to send the skin runtime
    (src/components/desktop/apps/media/wmp/vm.ts); after that the two talk
    only through postMessage.
-->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Skin script</title>
        <meta name="description" content="Where Din's Media Player runs a Windows Media Player skin's script.">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Skin script">
        <meta property="og:description" content="Where Din's Media Player runs a Windows Media Player skin's script.">
        <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; manifest-src 'self'">
        <link rel="manifest" href="/manifest.webmanifest">
    </head>
    <body>
        <script src="/wmp-sandbox.js"></script>
    </body>
</html>
